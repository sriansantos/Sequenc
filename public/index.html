<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0B0D">
  <meta name="description" content="Controle seus treinos, exercícios e cargas de academia.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sequenc">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <title>Sequenc · Treinos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="loader" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 10v4"/><path d="M8 7v10"/><path d="M16 7v10"/><path d="M19.5 10v4"/><path d="M8 12h8"/>
    </svg>
  </div>

  <header class="topbar">
    <div class="topbar-row">
      <div>
        <h1 id="page-title">Treino</h1>
        <p class="sub" id="page-sub"></p>
      </div>
      <div class="topbar-actions">
        <span class="demo-pill" id="demo-pill" hidden>demo</span>
        <button class="icon-btn" id="top-action" data-action="top-action" hidden aria-label="Adicionar"></button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="view active" id="view-treino"></section>
    <section class="view" id="view-exercicios"></section>
    <section class="view" id="view-historico"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-action="tab" data-arg="treino" aria-label="Treino">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 10v4"/><path d="M8 7v10"/><path d="M16 7v10"/><path d="M19.5 10v4"/><path d="M8 12h8"/>
      </svg>
      <span>Treino</span>
    </button>
    <button class="tab" data-action="tab" data-arg="exercicios" aria-label="Exercícios">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/>
        <rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>
      </svg>
      <span>Exercícios</span>
    </button>
    <button class="tab" data-action="tab" data-arg="historico" aria-label="Histórico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
      </svg>
      <span>Histórico</span>
    </button>
  </nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div id="sheet-content"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
